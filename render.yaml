services:
  - type: web
    name: vlr-gg-ics
    runtime: python
    region: singapore
    branch: master
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: calendar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: '3.14.7'
      - key: CALENDAR_DATA_DIR
        value: /var/data
