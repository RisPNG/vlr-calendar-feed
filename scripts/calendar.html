<article class="calendar-card" aria-labelledby="calendar-$slug">
  <div class="calendar-heading"><h3 id="calendar-$slug">$name</h3><p class="match-count"><strong>$match_count</strong> $match_label</p></div>
  <p class="calendar-description">$description</p>
  <div class="subscription-address"><code>$file</code><button type="button" data-feed="$file" aria-label="Copy subscription URL for $name" hidden>Copy link</button></div>
  <div class="calendar-actions"><a href="$file" download aria-label="Download $name as ICS">Download ICS</a><span>iCalendar subscription</span></div>
</article>
