<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --background: #101114;
      --foreground: #f5f5f5;
      --muted: #c7c7c7;
      --surface: #181a20;
      --border: #2c2e36;
      --shadow: rgba(0, 0, 0, .22);
      --card-text: #d0d0d0;
      --accent: #77dd77;
      --accent-text: #051405;
      --code-text: #b7ffb7;
      --code-background: #0b0c0f;
      --footer: #9c9c9c;
    }
    body { margin: 0; min-height: 100vh; background: var(--background); color: var(--foreground); }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    h1 { font-size: clamp(2rem, 5vw, 4rem); line-height: 1; margin: 0 0 16px; }
    .lede { color: var(--muted); font-size: 1.1rem; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card { border: 1px solid var(--border); background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: 0 20px 60px var(--shadow); }
    .card h2 { margin: 0 0 8px; }
    .card p { color: var(--card-text); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    a, button { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-text); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { font: inherit; }
    code { display: block; overflow-x: auto; color: var(--code-text); background: var(--code-background); border-radius: 12px; padding: 10px; }
    footer { margin-top: 32px; color: var(--footer); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>$title</h1>
    <p class="lede">$description</p>
    <section class="grid">$cards</section>
    <footer>Schedules refresh automatically. Subscription apps refresh on their own schedule.</footer>
  </main>
  <script>
    for (const button of document.querySelectorAll('button[data-feed]')) {
      const url = new URL(button.dataset.feed, window.location.href).href;
      button.closest('.card').querySelector('code').textContent = url;
      button.addEventListener('click', async () => {
        await navigator.clipboard.writeText(url);
        button.textContent = 'Copied';
        setTimeout(() => button.textContent = 'Copy subscription URL', 1500);
      });
    }
  </script>
</body>
</html>
